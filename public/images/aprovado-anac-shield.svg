<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 320" width="100%" height="100%">
  <defs>
    <!-- Outer Glow -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>

    <!-- Shield Gradients -->
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>

    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="40%" stop-color="#0369a1" />
      <stop offset="80%" stop-color="#0c2356" />
      <stop offset="100%" stop-color="#071330" />
    </linearGradient>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <linearGradient id="goldTrail" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ca8a04" stop-opacity="0" />
      <stop offset="40%" stop-color="#eab308" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>
  </defs>

  <g filter="url(#badgeGlow)">
    <!-- Outer Shield Border -->
    <path d="M 30,35 C 30,35 140,20 140,20 C 140,20 250,35 250,35 C 255,150 245,230 140,290 C 35,230 25,150 30,35 Z"
          fill="url(#shieldBorder)" />

    <!-- Inner Shield Body -->
    <path d="M 36,41 C 36,41 140,28 140,28 C 140,28 244,41 244,41 C 249,145 239,222 140,280 C 41,222 31,145 36,41 Z"
          fill="url(#shieldBg)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" />

    <!-- Top Ribbon Bar -->
    <path d="M 46,47 C 46,47 140,36 140,36 C 140,36 234,47 234,47 C 234,47 230,70 230,70 C 230,70 140,60 140,60 C 140,60 50,70 50,70 Z"
          fill="#061a40" stroke="url(#goldGradient)" stroke-width="1.5" />

    <text x="140" y="58" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="11" font-weight="900" fill="url(#goldGradient)" text-anchor="middle" letter-spacing="1.8">
      ✦ APROVADO ANAC ✦
    </text>

    <!-- Star Constellations in Sky -->
    <!-- Star 1 -->
    <polygon points="68,95 70,100 75,102 70,104 68,109 66,104 61,102 66,100" fill="#fef08a" opacity="0.85" />
    <!-- Star 2 -->
    <polygon points="212,98 214,103 219,105 214,107 212,112 210,107 205,105 210,103" fill="#fef08a" opacity="0.85" />
    <!-- Star 3 -->
    <polygon points="80,145 81,148 84,149 81,150 80,153 79,150 76,149 79,148" fill="#fef08a" opacity="0.7" />
    <!-- Star 4 -->
    <polygon points="200,150 201,153 204,154 201,155 200,158 199,155 196,154 199,153" fill="#fef08a" opacity="0.7" />

    <!-- Swooshing Jet Trail -->
    <path d="M 70,185 C 90,210 180,210 220,130 C 223,122 225,115 228,105 C 220,120 180,175 90,170 Z"
          fill="url(#goldTrail)" />

    <!-- Golden Arrow tip of trail -->
    <polygon points="228,105 215,115 230,120" fill="url(#goldGradient)" />

    <!-- Flying Airplane (White 3D Plane) -->
    <g transform="translate(135, 125) rotate(-28) scale(1.35)">
      <!-- Fuselage -->
      <path d="M 0,-32 L 6,-6 L 35,10 L 35,18 L 6,10 L 5,30 L 15,38 L 15,44 L 0,40 L -15,44 L -15,38 L -5,30 L -6,10 L -35,18 L -35,10 L -6,-6 Z"
            fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
      <!-- Shadow on left wing -->
      <path d="M 0,-32 L -6,-6 L -35,10 L -35,18 L -6,10 L -5,30 L -15,38 L -15,44 L 0,40 Z"
            fill="#e2e8f0" opacity="0.5" />
    </g>

    <!-- Logo / Brand Text "Voe Certo" -->
    <text x="140" y="215" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">
      Voe Certo
    </text>

    <!-- Golden Accent Lines & Star below Voe Certo -->
    <line x1="85" y1="228" x2="125" y2="228" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" />
    <polygon points="140,224 142,227 145,228 142,229 140,232 138,229 135,228 138,227" fill="url(#goldGradient)" />
    <line x1="155" y1="228" x2="195" y2="228" stroke="url(#goldGradient)" stroke-width="2" stroke-linecap="round" />
  </g>
</svg>
